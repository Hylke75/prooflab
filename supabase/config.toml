# Local Supabase stack for development and the CI end-to-end job (`supabase start` applies supabase/migrations).
# Only what ProofLab uses; everything else keeps the CLI defaults. Reference:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "prooflab"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Test data is created by scripts/e2e-seed.sh, never by a seed file.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

# Mail catcher (Mailpit) for magic links: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# The E2E journey signs in several times per run.
sign_in_sign_ups = 300
token_verifications = 300
email_sent = 100

[auth.email]
enabled = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"

# Accounts by invitation only (supabase/migrations/20261029090000_integrity.sql): the same hook as production.
# New users need an invitation or a signup_allowlist entry; scripts/e2e-seed.sh adds the test domain.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"
